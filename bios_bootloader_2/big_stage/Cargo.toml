[package]
name = "big_stage"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "big_stage"
test = false
bench = false

[dependencies]
acpi = { version = "6.1.1", default-features = false }
bitmap-allocator = "0.4.6"
common = { version = "0.1.0", path = "../common" }
heapless = "0.9.3"
log = "0.4.33"
nodit = { version = "0.10.0", default-features = false }
spin = "0.12.2"
spinning_top = "0.3.0"
talc = "5.0.4"
x86_64 = { version = "0.15.5", default-features = false, features = ["abi_x86_interrupt", "instructions"] }
zerocopy = "0.8.56"

[build-dependencies]
common = { version = "0.1.0", path = "../common" }
