[package]
name = "bios_bootloader"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bios_bootloader"
test = false
bench = false

[build-dependencies]
scripts = { path = "../scripts" }

[dependencies]
log = "0.4.33"
spin = { version = "0.12.2", default-features = false, features = ["once"] }
unicode-segmentation = "1.13.3"
zerocopy = { version = "0.8.55", default-features = false, features = ["derive"] }
